[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "encodec-live-streamer"
version = "0.2.0"
description = "Experimental FFmpeg-to-native-EnCodec rolling live stream publisher"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "EnCodec Live Streamer contributors" }]
dependencies = ["tomli>=2; python_version < '3.11'"]

[project.urls]
Homepage = "https://github.com/HenryDelMal/encodec-live-streamer"
Repository = "https://github.com/HenryDelMal/encodec-live-streamer.git"
Issues = "https://github.com/HenryDelMal/encodec-live-streamer/issues"

[project.scripts]
encodec-live = "encodec_live_streamer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
